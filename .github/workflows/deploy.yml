name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test --run

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1. Run migrations first (direct DB access)
      - name: Run Database Migrations
        run: bun run db:migrate

      # 2. Trigger remote build & deploy on Vercel and capture the URL
      - name: Deploy Project to Vercel
        id: vercel-deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_URL=$(bun x vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          else
            DEPLOY_URL=$(bun x vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # 3. Seed and Warm Database using the deployed URL
      - name: Seed and Warm Database
        run: |
          NEXT_PUBLIC_APP_URL=${{ env.DEPLOY_URL }} bun run db:seed
